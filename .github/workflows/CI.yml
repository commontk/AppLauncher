name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  # Static Qt builds published at https://github.com/lassoan/qt-static-build.
  # When changing the Qt version, also update "qt_archive_basename" and "qt_archive_sha256" in each job.
  qt_release_tag: qt-6.12.0-static

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      paths-to-include: ${{ steps.changes.outputs.paths-to-include }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Filter paths to determine whether to proceed with the build
      - name: "Filter Paths"
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            paths-to-include:
              - '**/CMakeLists.txt'
              - '**/*.cmake'
              - '**/*.cpp'
              - '**/*.h'
              - '**/*.h.in'
              - '**/*.ini'
              - '.github/scripts/**'
              - '.github/workflows/CI.yml'

  win-tests:
    needs: changes
    if: ${{ needs.changes.outputs.paths-to-include == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            qt_archive_sha256: 0ec7b0d0cc1f8bdb52cc69d5a6049a309a9cd3b8f7d26d86d2d01bf060e59ff6
            msvc_arch: amd64
          - arch: arm64
            runner: windows-11-arm
            qt_archive_sha256: 48b397184db33b63987bb0ce80e855d1e1eab63f9ede33aeca17d7f4426dda8e
            msvc_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      qt_archive_basename: qt-6.12.0-static-windows-msvc2022-${{ matrix.arch }}
    name: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: src

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}
          # Select the Visual Studio 2022 (v143) toolset used to build Qt: runners may
          # only have newer Visual Studio versions (windows-11-arm has Visual Studio 2026).
          toolset: "14.4"

      - name: Download Qt archive
        shell: bash
        run: |
          bash src/.github/scripts/download_qt.sh "${qt_release_tag}" "${qt_archive_basename}" "${{ matrix.qt_archive_sha256 }}"

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -G Ninja `
            -DQt6_DIR:PATH="${{ github.workspace }}\${{ env.qt_archive_basename }}\lib\cmake\Qt6" `
            -DCMAKE_BUILD_TYPE:STRING=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY:STRING=MultiThreaded `
            -DBUILD_TESTING:BOOL=ON `
            -S src `
            -B build

      - name: Build and package
        shell: pwsh
        run: |
          cmake --build build --target package

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure --timeout 60 -j4

      - name: Publish packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-${{ matrix.arch }}-packages
          path: build/CTKAppLauncher-*.tar.gz

  linux-tests:
    needs: changes
    if: ${{ needs.changes.outputs.paths-to-include == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qt_archive_sha256: 65930915f05153ec98dd355feca59041e2061973bb06db305a3053add7616773
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            qt_archive_sha256: c7756343dd8135f1de5c8917e4db9509d4e9d25ae5b161768ca5613b5c2d3db5
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    env:
      qt_archive_basename: qt-6.12.0-static-manylinux_2_28-${{ matrix.arch }}
    name: ${{ matrix.runner }} [manylinux_2_28]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: src

      - name: Download Qt archive
        run: |
          bash src/.github/scripts/download_qt.sh "${qt_release_tag}" "${qt_archive_basename}" "${{ matrix.qt_archive_sha256 }}"

      # Qt is built in the same manylinux_2_28 image (glibc 2.28), which keeps the
      # launcher usable on older distributions.
      - name: Build, package and test
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ${{ matrix.image }} \
            bash src/.github/scripts/manylinux_build.sh "/work/${qt_archive_basename}" src build

      - name: Publish packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}-packages
          path: build/CTKAppLauncher-*.tar.gz

  macos-tests:
    needs: changes
    if: ${{ needs.changes.outputs.paths-to-include == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            qt_archive_sha256: 84f81853910f2ac3920ffbda000d3a1d3b2c31d36269081b1859fc62e6881964
          - arch: arm64
            runner: macos-15
            qt_archive_sha256: c91f4ed1243ee7ddbba9fb5288b6dabde0f7af33e1ec0c381c1d1973cc33a84b
    runs-on: ${{ matrix.runner }}
    env:
      qt_archive_basename: qt-6.12.0-static-macos-${{ matrix.arch }}
    name: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: src

      - name: Download Qt archive
        run: |
          bash src/.github/scripts/download_qt.sh "${qt_release_tag}" "${qt_archive_basename}" "${{ matrix.qt_archive_sha256 }}"

      # The deployment target is the minimum macOS version supported by Qt 6.12
      - name: Configure
        run: |
          cmake \
            -DQt6_DIR:PATH=$(pwd)/${qt_archive_basename}/lib/cmake/Qt6 \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET:STRING=14.4 \
            -DCMAKE_OSX_ARCHITECTURES:STRING=${{ matrix.arch }} \
            -DBUILD_TESTING:BOOL=ON \
            -B build -S src
        env:
          CC: clang
          CXX: clang++

      - name: Build and Package
        run: |
          cmake --build build --target package -- -j4

      # Exclude tests requiring X Display
      - name: Test
        run: |
          cd build
          ctest -LE XDisplayRequired --output-on-failure --timeout 60

      - name: Publish packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-packages
          path: build/CTKAppLauncher-*.tar.gz

  pass: # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - changes
      - linux-tests
      - macos-tests
      - win-tests

    runs-on: ubuntu-latest

    steps:
      - name: Validate paths-to-include value
        run: |
          value="${{ needs.changes.outputs.paths-to-include }}"
          echo "paths-to-include = '$value'"
          if [[ "$value" != "true" && "$value" != "false" ]]; then
            echo "::error::Invalid paths-to-include value: '$value'. Expected 'true' or 'false'."
            exit 1
          fi

      - name: Set allowed skips
        id: allow
        run: |
          if [[ "${{ needs.changes.outputs.paths-to-include }}" != "true" ]]; then
            echo "value=[\"win-tests\",\"linux-tests\",\"macos-tests\"]" >> $GITHUB_OUTPUT
          else
            echo "value=[]" >> $GITHUB_OUTPUT
          fi

      - name: Show job results
        run: |
          echo "paths-to-include = ${{ needs.changes.outputs.paths-to-include }}"
          echo "win-tests result = ${{ needs.win-tests.result }}"
          echo "linux-tests result = ${{ needs.linux-tests.result }}"
          echo "macos-tests result = ${{ needs.macos-tests.result }}"
          echo "allowed-skips value = ${{ steps.allow.outputs.value }}"

      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # Allow test jobs to be skipped when the 'paths-to-include' filter determined
          # that no relevant files were modified (e.g., only docs or README changed).
          # This ensures the 'pass' job still succeeds and branch protection is satisfied.
          allowed-skips: ${{ steps.allow.outputs.value }}
